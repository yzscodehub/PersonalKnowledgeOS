name: Validate Knowledge Base

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate knowledge base
        run: python scripts/validate_kb.py

      - name: Check D3 workflow registry
        run: python scripts/check_workflow_registry.py

      - name: Check public assets
        run: python scripts/check_public_assets.py

      - name: Check Phase 1 consistency
        run: python scripts/check_pilot_consistency.py

      - name: Run math and graphics experiments
        run: |
          python experiments/math_graphics/coordinate_conventions.py
          python experiments/math_graphics/transform_invariants.py
          python experiments/math_graphics/projection_mapping.py
          python experiments/math_graphics/depth_precision.py

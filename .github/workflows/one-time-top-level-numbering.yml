name: One-time top-level numbering migration

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write
  pull-requests: read

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/knowledge-base-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply numbering migration
        run: python scripts/one_time_top_level_numbering_migration.py

      - name: Validate knowledge base, assets, and experiments
        run: |
          python scripts/validate_kb.py
          python scripts/check_public_assets.py
          python experiments/math_graphics/coordinate_conventions.py
          python experiments/math_graphics/projection_mapping.py
          python experiments/math_graphics/depth_precision.py

      - name: Commit migration
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: freeze top-level numbering semantics"
          git push origin HEAD:design/knowledge-base-v3

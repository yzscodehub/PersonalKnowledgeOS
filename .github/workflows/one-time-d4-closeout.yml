name: One-time D4 closeout

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write
  pull-requests: read

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/knowledge-base-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply D4 closeout
        run: python scripts/one_time_d4_closeout.py

      - name: Validate repository
        run: |
          python scripts/validate_kb.py
          python scripts/check_workflow_registry.py
          python scripts/check_domain_blueprints.py
          python scripts/check_public_assets.py
          python scripts/check_pilot_consistency.py
          python experiments/math_graphics/coordinate_conventions.py
          python experiments/math_graphics/transform_invariants.py
          python experiments/math_graphics/projection_mapping.py
          python experiments/math_graphics/depth_precision.py

      - name: Commit D4 closeout
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No closeout changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: complete D4 knowledge domain blueprints"
          git push origin HEAD:design/knowledge-base-v3
